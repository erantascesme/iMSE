[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imse-reproduction"
version = "0.1.0"
description = "Reproduction of the iMSE out-of-distribution detection benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.8",
  "torchvision>=0.23",
  "timm==1.0.11",
  "numpy==2.1.3",
  "scipy==1.16.1",
  "scikit-learn==1.7.1",
  "pandas==2.3.2",
  "Pillow==11.3.0",
  "huggingface-hub==0.34.4",
  "safetensors>=0.4",
  "faiss-cpu==1.12.0",
  "gdown==5.2.0",
  "requests>=2.32",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imse = ["assets/*.json", "assets/manifests/*.gz", "assets/upstream/*"]
